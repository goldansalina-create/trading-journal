<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trading Journal" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ICT Trading Journal — Smart Money Diary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            graphite: {
              950: '#0e0f12',
              900: '#14161a',
              800: '#1a1d23',
              700: '#22262e',
              600: '#2c313a',
            },
            accent: {
              DEFAULT: '#6b8afd',
              soft: 'rgba(107,138,253,0.15)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #0e0f12;
      --card: #14161a;
      --border: rgba(255,255,255,0.08);
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6b8afd;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      overflow: hidden;
      height: 100vh;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .card:hover {
      border-color: rgba(255,255,255,0.14);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .column {
      background: rgba(20,22,26,0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      min-width: 300px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .column-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: grab;
    }
    .column-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .entry-card {
      background: #1a1d23;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .entry-card:hover {
      border-color: rgba(107,138,253,0.35);
      transform: translateY(-1px);
    }
    .entry-card.dragging { opacity: 0.4; }
    .thumb {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 4px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: #14161a;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #5a79e8; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }
    .btn-danger {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border-color: rgba(239,68,68,0.25);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    input, textarea, select {
      background: #1a1d23;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(107,138,253,0.5);
    }
    textarea { resize: vertical; min-height: 160px; font-family: inherit; line-height: 1.55; }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      position: relative;
      transition: background 0.15s;
    }
    .calendar-day:hover { background: rgba(255,255,255,0.06); }
    .calendar-day.today { background: rgba(107,138,253,0.18); color: var(--accent); font-weight: 600; }
    .calendar-day.has-entries::after {
      content: '';
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
    }
    .calendar-day.other-month { color: #4b5563; }
    .image-viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .image-viewer img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 4px;
      transition: transform 0.2s;
    }
    .drop-zone {
      border: 2px dashed rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      transition: all 0.2s;
    }
    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(107,138,253,0.08);
      color: var(--accent);
    }
    .preview-content {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #c9cdd3;
    }
    .preview-content input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
      accent-color: var(--accent);
    }
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: #0e0f12;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }
    .nav-item.active { color: var(--accent); }
    .search-input {
      background: #1a1d23;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px 8px 36px;
      font-size: 13px;
      width: 100%;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .badge {
      font-size: 11px;
      background: rgba(107,138,253,0.2);
      color: var(--accent);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 500;
    }
    .install-hint {
      font-size: 10.5px;
      line-height: 1.4;
      color: var(--muted);
      padding: 8px 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="app" class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="p-4 border-b border-white/10">
        <div class="flex items-center gap-2 mb-4">
          <div class="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center text-accent font-bold text-sm">ICT</div>
          <div>
            <div class="font-semibold text-sm tracking-tight">Trading Journal</div>
            <div class="text-[11px] text-muted">Smart Money · Local</div>
          </div>
        </div>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="searchInput" type="text" class="search-input" placeholder="Поиск по заголовкам, тикерам..." />
        </div>
      </div>

      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <div class="nav-item active" data-view="board">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>
          Доска
        </div>
        <div class="nav-item" data-view="calendar">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Календарь
        </div>
        <div class="nav-item" data-view="templates">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
          Шаблоны
        </div>
      </nav>

      <div class="p-3 border-t border-white/10 space-y-2">
        <!-- PWA Install UI -->
        <div id="installContainer" class="space-y-2">
          <button id="btnInstall" class="btn btn-primary w-full justify-center text-xs hidden">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Установить приложение
          </button>
          <div id="installHint" class="install-hint"></div>
        </div>

        <button id="btnExport" class="btn btn-ghost w-full justify-center text-xs">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Export JSON
        </button>
        <button id="btnImport" class="btn btn-ghost w-full justify-center text-xs">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Import JSON
        </button>
        <input type="file" id="importFile" accept=".json" class="hidden" />
        <div class="text-[10px] text-center text-muted/60 pt-1">Данные хранятся локально</div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Toolbar -->
      <header class="h-14 border-b border-white/10 flex items-center justify-between px-5 shrink-0">
        <div class="flex items-center gap-3">
          <h1 id="viewTitle" class="text-sm font-semibold tracking-tight">Доска тем</h1>
          <span id="entryCount" class="badge hidden">0</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnAddColumn" class="btn btn-ghost text-xs">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Колонка
          </button>
          <button id="btnNewEntry" class="btn btn-primary text-xs">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Новая запись
          </button>
        </div>
      </header>

      <!-- Views -->
      <div id="viewBoard" class="flex-1 overflow-x-auto overflow-y-hidden p-4">
        <div id="columnsContainer" class="flex gap-4 h-full pb-2"></div>
      </div>

      <div id="viewCalendar" class="flex-1 overflow-auto p-6 hidden">
        <div class="max-w-3xl mx-auto">
          <div class="flex items-center justify-between mb-6">
            <button id="calPrev" class="btn btn-ghost text-xs">←</button>
            <div class="flex items-center gap-3">
              <h2 id="calTitle" class="text-lg font-semibold"></h2>
              <button id="calToday" class="btn btn-ghost text-xs">Сегодня</button>
            </div>
            <button id="calNext" class="btn btn-ghost text-xs">→</button>
          </div>
          <div class="grid grid-cols-7 gap-1 mb-2">
            <div class="text-center text-[11px] text-muted font-medium py-1">Пн</div>
            <div class="text-center text-[11px] text-muted font-medium py-1">Вт</div>
            <div class="text-center text-[11px] text-muted font-medium py-1">Ср</div>
            <div class="text-center text-[11px] text-muted font-medium py-1">Чт</div>
            <div class="text-center text-[11px] text-muted font-medium py-1">Пт</div>
            <div class="text-center text-[11px] text-muted font-medium py-1">Сб</div>
            <div class="text-center text-[11px] text-muted font-medium py-1">Вс</div>
          </div>
          <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
        </div>
      </div>

      <div id="viewTemplates" class="flex-1 overflow-auto p-6 hidden">
        <div class="max-w-3xl mx-auto">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold">Шаблоны записей</h2>
            <button id="btnNewTemplate" class="btn btn-primary text-xs">+ Новый шаблон</button>
          </div>
          <div id="templatesList" class="space-y-3"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Entry Modal -->
  <div id="entryModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <div class="flex items-center gap-3 flex-1">
          <input id="entryTitle" type="text" placeholder="Заголовок записи..." class="bg-transparent border-0 text-base font-semibold p-0 focus:ring-0" style="border:none;background:transparent;padding:0;" />
        </div>
        <div class="flex items-center gap-2">
          <button id="btnCopyMd" class="btn btn-ghost text-xs" title="Копировать Markdown">MD</button>
          <button id="btnDeleteEntry" class="btn btn-danger text-xs">Удалить</button>
          <button id="btnCloseEntry" class="btn btn-ghost text-xs">Закрыть</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="grid grid-cols-3 gap-3 mb-4">
          <div>
            <label class="text-[11px] text-muted mb-1 block">Дата</label>
            <input id="entryDate" type="date" />
          </div>
          <div>
            <label class="text-[11px] text-muted mb-1 block">Теги / Тикеры</label>
            <input id="entryTags" type="text" placeholder="NQ, OTE, BSL..." />
          </div>
          <div>
            <label class="text-[11px] text-muted mb-1 block">Колонка</label>
            <select id="entryColumn"></select>
          </div>
        </div>
        <div class="mb-3 flex items-center gap-2">
          <label class="text-[11px] text-muted">Шаблон:</label>
          <select id="entryTemplateSelect" class="w-auto text-xs py-1">
            <option value="">— не применять —</option>
          </select>
          <button id="btnApplyTemplate" class="btn btn-ghost text-xs">Применить</button>
        </div>
        <div>
          <label class="text-[11px] text-muted mb-1 block">Содержание (Markdown + чекбоксы - [ ] )</label>
          <textarea id="entryContent" rows="12" placeholder="Пишите заметку...&#10;&#10;- [ ] Правило 1&#10;- [ ] Правило 2"></textarea>
        </div>
        <div class="mt-4">
          <label class="text-[11px] text-muted mb-2 block">Скриншоты (Ctrl/Cmd+V или drag & drop)</label>
          <div id="dropZone" class="drop-zone mb-3">
            Перетащите изображения сюда или вставьте из буфера
          </div>
          <div id="imagesPreview" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="mt-6 flex justify-end gap-2">
          <button id="btnSaveEntry" class="btn btn-primary">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Day Modal -->
  <div id="dayModal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:640px;">
      <div class="modal-header">
        <h3 id="dayModalTitle" class="font-semibold text-sm"></h3>
        <button id="btnCloseDay" class="btn btn-ghost text-xs">Закрыть</button>
      </div>
      <div class="modal-body">
        <div class="mb-4">
          <label class="text-[11px] text-muted mb-1 block">Заметка дня</label>
          <textarea id="dayNote" rows="3" placeholder="Быстрая заметка на этот день..."></textarea>
          <button id="btnSaveDayNote" class="btn btn-ghost text-xs mt-2">Сохранить заметку</button>
        </div>
        <div class="mb-3 flex items-center justify-between">
          <span class="text-xs text-muted">Записи на этот день</span>
          <button id="btnNewEntryOnDay" class="btn btn-primary text-xs">+ Запись</button>
        </div>
        <div id="dayEntries" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <!-- Template Modal -->
  <div id="templateModal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:640px;">
      <div class="modal-header">
        <input id="templateName" type="text" placeholder="Название шаблона" class="bg-transparent border-0 text-base font-semibold p-0" style="border:none;background:transparent;padding:0;" />
        <div class="flex gap-2">
          <button id="btnDeleteTemplate" class="btn btn-danger text-xs">Удалить</button>
          <button id="btnCloseTemplate" class="btn btn-ghost text-xs">Закрыть</button>
        </div>
      </div>
      <div class="modal-body">
        <textarea id="templateContent" rows="16" placeholder="Содержимое шаблона..."></textarea>
        <div class="mt-4 flex justify-end">
          <button id="btnSaveTemplate" class="btn btn-primary">Сохранить шаблон</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Image Viewer -->
  <div id="imageViewer" class="image-viewer hidden">
    <img id="viewerImg" src="" alt="Preview" />
  </div>

  <script>
    // ===================== PWA: Icons + Manifest + Service Worker =====================
    function generateIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#0e0f12';
      ctx.fillRect(0, 0, size, size);

      // Subtle rounded rect / card feel
      const margin = size * 0.12;
      const radius = size * 0.18;
      ctx.fillStyle = '#14161a';
      roundRect(ctx, margin, margin, size - margin * 2, size - margin * 2, radius);
      ctx.fill();

      // Accent border
      ctx.strokeStyle = 'rgba(107,138,253,0.35)';
      ctx.lineWidth = Math.max(2, size * 0.015);
      roundRect(ctx, margin, margin, size - margin * 2, size - margin * 2, radius);
      ctx.stroke();

      // ICT text
      ctx.fillStyle = '#6b8afd';
      ctx.font = `700 ${Math.round(size * 0.28)}px Inter, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ICT', size / 2, size / 2 + size * 0.02);

      return canvas.toDataURL('image/png');
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function setupPWA() {
      try {
        const icon192 = generateIcon(192);
        const icon512 = generateIcon(512);

        // Apple touch icon
        let appleLink = document.querySelector('link[rel="apple-touch-icon"]');
        if (!appleLink) {
          appleLink = document.createElement('link');
          appleLink.rel = 'apple-touch-icon';
          document.head.appendChild(appleLink);
        }
        appleLink.href = icon192;

        // Favicon
        let favicon = document.querySelector('link[rel="icon"]');
        if (!favicon) {
          favicon = document.createElement('link');
          favicon.rel = 'icon';
          favicon.type = 'image/png';
          document.head.appendChild(favicon);
        }
        favicon.href = icon192;

        // Manifest via Blob
        const manifest = {
          name: 'ICT Trading Journal',
          short_name: 'Trading Journal',
          description: 'Smart Money / ICT trading diary with custom columns, calendar and templates',
          start_url: './',
          scope: './',
          display: 'standalone',
          orientation: 'any',
          background_color: '#0e0f12',
          theme_color: '#0e0f12',
          icons: [
            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);

        let manifestLink = document.querySelector('link[rel="manifest"]');
        if (!manifestLink) {
          manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          document.head.appendChild(manifestLink);
        }
        manifestLink.href = manifestURL;

        // Minimal Service Worker (only works over http/https, not file://)
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
          const swCode = `
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
            self.addEventListener('fetch', (e) => {
              // Network-first, fallback to cache if needed (minimal)
              e.respondWith(
                fetch(e.request).catch(() => caches.match(e.request))
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swURL = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swURL).catch(err => {
            console.info('Service Worker registration skipped/failed (expected on file:// or restricted contexts):', err.message);
          });
        }
      } catch (err) {
        console.info('PWA setup partial failure:', err);
      }
    }

    // ===================== HELPERS =====================
    function formatDate(d) {
      if (!d) return '';
      const date = typeof d === 'string' ? new Date(d + 'T00:00:00') : d;
      return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
    }

    function toISODate(d) {
      const date = d instanceof Date ? d : new Date(d);
      return date.toISOString().slice(0, 10);
    }

    function truncate(str, len = 80) {
      if (!str) return '';
      return str.length > len ? str.slice(0, len) + '…' : str;
    }

    function renderMarkdownPreview(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/^- \[ \] (.+)$/gm, '<label class="flex items-start gap-2 my-1"><input type="checkbox" disabled> <span>$1</span></label>')
        .replace(/^- \[x\] (.+)$/gim, '<label class="flex items-start gap-2 my-1"><input type="checkbox" checked disabled> <span class="line-through opacity-70">$1</span></label>')
        .replace(/^## (.+)$/gm, '<div class="font-semibold text-sm mt-3 mb-1 text-white">$1</div>')
        .replace(/^### (.+)$/gm, '<div class="font-medium text-xs mt-2 mb-1 text-white/90">$1</div>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

          if (draggedColId && draggedColId !== col.id) {
            const sorted = [...state.columns].sort((a,b) => a.order - b.order);
            const fromIdx = sorted.findIndex(c => c.id === draggedColId);
            const toIdx = sorted.findIndex(c => c.id === col.id);
            if (fromIdx > -1 && toIdx > -1) {
              const [moved] = sorted.splice(fromIdx, 1);
              sorted.splice(toIdx, 0, moved);

    // ===================== CALENDAR =====================
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const title = document.getElementById('calTitle');
      const d = state.calendarDate;
      const year = d.getFullYear();
      const month = d.getMonth();

      title.textContent = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1);
      let startDow = firstDay.getDay();
      startDow = startDow === 0 ? 6 : startDow - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevDays = new Date(year, month, 0).getDate();

      const todayISO = toISODate(new Date());
      const entriesByDate = {};
      state.entries.forEach(e => {
        if (e.date) {
          entriesByDate[e.date] = (entriesByDate[e.date] || 0) + 1;
        }
      });
      Object.keys(state.dayNotes).forEach(dt => {
        if (state.dayNotes[dt]) entriesByDate[dt] = (entriesByDate[dt] || 0) + 1;
      });

      grid.innerHTML = '';
      for (let i = startDow - 1; i >= 0; i--) {
        const day = prevDays - i;
        const el = document.createElement('div');
        el.className = 'calendar-day other-month';
        el.textContent = day;
        grid.appendChild(el);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const el = document.createElement('div');
        el.className = 'calendar-day';
        if (iso === todayISO) el.classList.add('today');
        if (entriesByDate[iso]) el.classList.add('has-entries');
        el.innerHTML = `<span>${day}</span>`;
        if (entriesByDate[iso] > 1) {
          el.innerHTML += `<span class="absolute top-1 right-1 text-[9px] text-accent font-mono">${entriesByDate[iso]}</span>`;
        }
        el.addEventListener('click', () => openDayModal(iso));
        grid.appendChild(el);
      }
      const totalCells = startDow + daysInMonth;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remaining; i++) {
        const el = document.createElement('div');
        el.className = 'calendar-day other-month';
        el.textContent = i;
        grid.appendChild(el);
      }
    }

    function openEntryModal(entryId = null, defaultColId = null, defaultDate = null) {
      state.editingEntryId = entryId;
      const modal = document.getElementById('entryModal');
      const titleIn = document.getElementById('entryTitle');
      const dateIn = document.getElementById('entryDate');
      const tagsIn = document.getElementById('entryTags');
      const colSelect = document.getElementById('entryColumn');
      const contentIn = document.getElementById('entryContent');
      const tplSelect = document.getElementById('entryTemplateSelect');

      colSelect.innerHTML = state.columns
        .sort((a,b) => a.order - b.order)
        .map(c => `<option value="${c.id}">${c.title}</option>`).join('');

        state.templates.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

      if (entryId) {
        const entry = state.entries.find(e => e.id === entryId);
        if (!entry) return;
        titleIn.value = entry.title || '';
        dateIn.value = entry.date || '';
        tagsIn.value = entry.tags || '';
        colSelect.value = entry.columnId || '';
        contentIn.value = entry.content || '';
        renderImagesPreview(entry.images || []);
        document.getElementById('btnDeleteEntry').style.display = '';
      } else {
        titleIn.value = '';
        dateIn.value = defaultDate || toISODate(new Date());
        tagsIn.value = '';
        colSelect.value = defaultColId || (state.columns[0] && state.columns[0].id) || '';
        contentIn.value = '';
        renderImagesPreview([]);
        document.getElementById('btnDeleteEntry').style.display = 'none';

      modal.classList.remove('hidden');

    function renderImagesPreview(images) {
      const container = document.getElementById('imagesPreview');
      container.innerHTML = '';
      (images || []).forEach((src, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'relative group';
        wrap.innerHTML = `
          <img src="${src}" class="w-24 h-20 object-cover rounded-lg border border-white/10 cursor-pointer" data-idx="${idx}" />

        `;
        wrap.querySelector('img').addEventListener('click', () => openImageViewer(src));
        wrap.querySelector('button').addEventListener('click', e => {
          e.stopPropagation();
          const entry = getCurrentEditingImages();
          entry.splice(idx, 1);
          renderImagesPreview(entry);
        });
        container.appendChild(wrap);
      });
      container.dataset.images = JSON.stringify(images || []);
    }

    function getCurrentEditingImages() {
      const container = document.getElementById('imagesPreview');
      try { return JSON.parse(container.dataset.images || '[]'); } catch { return []; }
    }

    function saveEntry() {
      const title = document.getElementById('entryTitle').value.trim();
      const date = document.getElementById('entryDate').value;
      const tags = document.getElementById('entryTags').value.trim();
      const columnId = document.getElementById('entryColumn').value;
      const content = document.getElementById('entryContent').value;
      const images = getCurrentEditingImages();

      if (state.editingEntryId) {
        const entry = state.entries.find(e => e.id === state.editingEntryId);
        if (entry) {
          entry.title = title;
          entry.date = date;
          entry.tags = tags;
          entry.columnId = columnId;
          entry.content = content;
          entry.images = images;
          entry.updatedAt = new Date().toISOString();
        }
      } else {
        state.entries.push({
          id: uid(),
          title,
          date,
          tags,
          columnId,
          content,
          images,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
      }
      save();
      closeEntryModal();
      renderCurrentView();
    }

    function closeEntryModal() {
      document.getElementById('entryModal').classList.add('hidden');
      state.editingEntryId = null;
    }

    function openDayModal(isoDate) {
      state.selectedDay = isoDate;
      const modal = document.getElementById('dayModal');
      document.getElementById('dayModalTitle').textContent = formatDate(isoDate) + ' · ' + new Date(isoDate + 'T00:00:00').toLocaleDateString('ru-RU', { weekday: 'long' });
      document.getElementById('dayNote').value = state.dayNotes[isoDate] || '';

      const dayEntries = state.entries.filter(e => e.date === isoDate);
      const list = document.getElementById('dayEntries');
      list.innerHTML = dayEntries.length === 0
        ? '<div class="empty-state">Нет записей на этот день</div>'
        : dayEntries.map(e => `
          <div class="entry-card" data-id="${e.id}">
            <div class="font-medium text-sm">${e.title || 'Без названия'}</div>
            <div class="text-xs text-muted mt-0.5">${e.tags || ''} · ${state.columns.find(c => c.id === e.columnId)?.title || ''}</div>
          </div>
        `).join('');

      list.querySelectorAll('.entry-card').forEach(el => {
        el.addEventListener('click', () => {
          closeDayModal();
          openEntryModal(el.dataset.id);
        });
      });

      modal.classList.remove('hidden');
    }

    function closeDayModal() {
      document.getElementById('dayModal').classList.add('hidden');
      state.selectedDay = null;
    }

    function openTemplateModal(tplId = null) {
      state.editingTemplateId = tplId;
      const modal = document.getElementById('templateModal');
      if (tplId) {
        const tpl = state.templates.find(t => t.id === tplId);
        document.getElementById('templateName').value = tpl.name;
        document.getElementById('templateContent').value = tpl.content;
        document.getElementById('btnDeleteTemplate').style.display = '';
      } else {
        document.getElementById('templateName').value = '';
        document.getElementById('templateContent').value = '';
        document.getElementById('btnDeleteTemplate').style.display = 'none';
      }
      modal.classList.remove('hidden');
    }

    function closeTemplateModal() {
      document.getElementById('templateModal').classList.add('hidden');
      state.editingTemplateId = null;
    }

    function openImageViewer(src) {
      document.getElementById('viewerImg').src = src;
      document.getElementById('imageViewer').classList.remove('hidden');
    }

    // ===================== IMAGE HANDLING =====================
    function handleImageFiles(files) {
      const images = getCurrentEditingImages();
      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1600;
            let w = img.width, h = img.height;
            if (w > maxW) {
              h = Math.round(h * maxW / w);
              w = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            images.push(dataUrl);
            renderImagesPreview(images);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ===================== VIEWS =====================
    function switchView(view) {
      state.currentView = view;
      document.getElementById('viewBoard').classList.toggle('hidden', view !== 'board');
      document.getElementById('viewCalendar').classList.toggle('hidden', view !== 'calendar');
      document.getElementById('viewTemplates').classList.toggle('hidden', view !== 'templates');

      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.view === view);
      });

      const titles = { board: 'Доска тем', calendar: 'Календарь', templates: 'Шаблоны' };
      document.getElementById('viewTitle').textContent = titles[view] || '';

      document.getElementById('btnAddColumn').style.display = view === 'board' ? '' : 'none';
      document.getElementById('btnNewEntry').style.display = view === 'templates' ? 'none' : '';

      renderCurrentView();
    }

    function renderCurrentView() {
      if (state.currentView === 'board') renderBoard();
      else if (state.currentView === 'calendar') renderCalendar();
      else if (state.currentView === 'templates') renderTemplates();
    }

    // ===================== EXPORT / IMPORT =====================
    function exportJSON() {
      const data = {
        version: 1,
        exportedAt: new Date().toISOString(),
        columns: state.columns,
        entries: state.entries,
        dayNotes: state.dayNotes,
        templates: state.templates,
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ict-journal-backup-${toISODate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(file) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data.columns || !data.entries) throw new Error('Неверный формат');
          if (!confirm('Импорт заменит текущие данные. Продолжить?')) return;
          state.columns = data.columns;
          state.entries = data.entries;
          state.dayNotes = data.dayNotes || {};
          state.templates = data.templates || [...DEFAULT_TEMPLATES];
          save();
          renderCurrentView();
          alert('Импорт успешно завершён');
        } catch (err) {
          alert('Ошибка импорта: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // ===================== INIT & EVENTS =====================
    function init() {
      // PWA first
      setupPWA();
      updateInstallUI();

      load();
      renderBoard();

      // Install button
      document.getElementById('btnInstall').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        updateInstallUI();
      });

      // Navigation
      document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => switchView(el.dataset.view));
      });

      // Search
      document.getElementById('searchInput').addEventListener('input', e => {
        state.searchQuery = e.target.value;
        if (state.currentView === 'board') renderBoard();
      });

      // Toolbar
      document.getElementById('btnAddColumn').addEventListener('click', () => {
        const name = prompt('Название новой колонки:');
        if (!name || !name.trim()) return;
        const emojiInput = prompt('Эмодзи для колонки (или оставьте пустым):', '📌');
        const emoji = (emojiInput && emojiInput.trim()) ? [...emojiInput.trim()][0] : '📌';
        const maxOrder = state.columns.reduce((m, c) => Math.max(m, c.order), -1);
        state.columns.push({ id: uid(), title: name.trim(), emoji, order: maxOrder + 1 });
        save();
        renderBoard();
      });

      document.getElementById('btnNewEntry').addEventListener('click', () => openEntryModal());

      // Entry modal
      document.getElementById('btnCloseEntry').addEventListener('click', closeEntryModal);
      document.getElementById('btnSaveEntry').addEventListener('click', saveEntry);
      document.getElementById('btnDeleteEntry').addEventListener('click', () => {
        if (!state.editingEntryId || !confirm('Удалить запись?')) return;
        state.entries = state.entries.filter(e => e.id !== state.editingEntryId);
        save();
        closeEntryModal();
        renderCurrentView();
      });
      document.getElementById('btnApplyTemplate').addEventListener('click', () => {
        const tplId = document.getElementById('entryTemplateSelect').value;
        if (!tplId) return;
        const tpl = state.templates.find(t => t.id === tplId);
        if (tpl) {
          const current = document.getElementById('entryContent').value;
          document.getElementById('entryContent').value = current
            ? current + '\n\n' + tpl.content
            : tpl.content;
        }
      });
      document.getElementById('btnCopyMd').addEventListener('click', () => {
        const title = document.getElementById('entryTitle').value;
        const date = document.getElementById('entryDate').value;
        const tags = document.getElementById('entryTags').value;
        const content = document.getElementById('entryContent').value;
        const md = `# ${title}\n\n**Дата:** ${date}  \n**Теги:** ${tags}\n\n${content}`;
        navigator.clipboard.writeText(md).then(() => alert('Скопировано в буфер как Markdown'));
      });

      // Image paste / drop
      const dropZone = document.getElementById('dropZone');
      dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleImageFiles(e.dataTransfer.files);
      });
      document.getElementById('entryModal').addEventListener('paste', e => {
        if (e.clipboardData.files.length) {
          e.preventDefault();
          handleImageFiles(e.clipboardData.files);
        }
      });

      // Day modal
      document.getElementById('btnCloseDay').addEventListener('click', closeDayModal);
      document.getElementById('btnSaveDayNote').addEventListener('click', () => {
        const note = document.getElementById('dayNote').value;
        if (state.selectedDay) {
          if (note.trim()) state.dayNotes[state.selectedDay] = note;
          else delete state.dayNotes[state.selectedDay];
          save();
          renderCalendar();
        }
      });
      document.getElementById('btnNewEntryOnDay').addEventListener('click', () => {
        const day = state.selectedDay;
        closeDayModal();
        openEntryModal(null, null, day);
      });

      // Calendar nav
      document.getElementById('calPrev').addEventListener('click', () => {
        state.calendarDate.setMonth(state.calendarDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById('calNext').addEventListener('click', () => {
        state.calendarDate.setMonth(state.calendarDate.getMonth() + 1);
        renderCalendar();
      });
      document.getElementById('calToday').addEventListener('click', () => {
        state.calendarDate = new Date();
        renderCalendar();
      });

      // Templates
      document.getElementById('btnNewTemplate').addEventListener('click', () => openTemplateModal());
      document.getElementById('btnCloseTemplate').addEventListener('click', closeTemplateModal);
      document.getElementById('btnSaveTemplate').addEventListener('click', () => {
        const name = document.getElementById('templateName').value.trim();
        const content = document.getElementById('templateContent').value;
        if (!name) return alert('Укажите название');
        if (state.editingTemplateId) {
          const tpl = state.templates.find(t => t.id === state.editingTemplateId);
          if (tpl) { tpl.name = name; tpl.content = content; }
        } else {
          state.templates.push({ id: uid(), name, content });
        }
        save();
        closeTemplateModal();
        renderTemplates();
      });
      document.getElementById('btnDeleteTemplate').addEventListener('click', () => {
        if (!state.editingTemplateId || !confirm('Удалить шаблон?')) return;
        state.templates = state.templates.filter(t => t.id !== state.editingTemplateId);
        save();
        closeTemplateModal();
        renderTemplates();
      });

      // Image viewer
      document.getElementById('imageViewer').addEventListener('click', () => {
        document.getElementById('imageViewer').classList.add('hidden');
      });

      // Export / Import
      document.getElementById('btnExport').addEventListener('click', exportJSON);
      document.getElementById('btnImport').addEventListener('click', () => document.getElementById('importFile').click());
      document.getElementById('importFile').addEventListener('change', e => {
        if (e.target.files[0]) importJSON(e.target.files[0]);
        e.target.value = '';
      });

      // Close modals on backdrop click
      ['entryModal', 'dayModal', 'templateModal'].forEach(id => {
        document.getElementById(id).addEventListener('click', e => {
          if (e.target.id === id) {
            if (id === 'entryModal') closeEntryModal();
            if (id === 'dayModal') closeDayModal();
            if (id === 'templateModal') closeTemplateModal();
          }
        });
      });

      // Keyboard
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          closeEntryModal();
          closeDayModal();
          closeTemplateModal();
          document.getElementById('imageViewer').classList.add('hidden');
        }
      });
    }

    init();
  </script>
</body>
</html>
